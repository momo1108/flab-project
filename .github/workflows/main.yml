name: AWS_CICD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      # 환경변수 파일 생성
      - name: Generate .env.production
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BASE_URL: ${{ secrets.TMDB_BASE_URL }}
          TMDB_IMAGE_BASE_URL: ${{ secrets.TMDB_IMAGE_BASE_URL }}
        run: |
          cat <<EOF > .env.production
          TMDB_API_KEY=$TMDB_API_KEY
          TMDB_BASE_URL=$TMDB_BASE_URL
          TMDB_IMAGE_BASE_URL=$TMDB_IMAGE_BASE_URL
          APP_PHASE=production
          EOF

      # 빌드
      - name: Build
        run: npm run build:production

      # 배포 (JS/CSS: 1주 캐시)
      - name: S3 Deploy JS CSS
        run: |
          aws s3 sync ./dist s3://watcha-clone-prod-244892142287-ap-northeast-2-an/ \
            --exclude "*" \
            --include "*.js" \
            --include "*.css" \
            --cache-control "public, max-age=604800" \
            --acl bucket-owner-full-control
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2

      # 배포 (기타 에셋: 1년 캐시)
      - name: S3 Deploy Other Assets
        run: |
          aws s3 sync ./dist s3://watcha-clone-prod-244892142287-ap-northeast-2-an/ \
            --exclude "index.html" \
            --exclude "*.js" \
            --exclude "*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --acl bucket-owner-full-control
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2

      # 배포 (HTML: 항상 최신 확인)
      - name: S3 Deploy HTML
        run: |
          aws s3 cp ./dist/index.html s3://watcha-clone-prod-244892142287-ap-northeast-2-an/index.html \
            --cache-control "max-age=0, s-maxage=31536000" \
            --content-type "text/html; charset=utf-8" \
            --acl bucket-owner-full-control
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2

      # CloudFront 기존 캐시 무효화
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $AWS_DISTRIBUTION \
            --paths $PATHS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
          AWS_DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION_ID }}
          PATHS: '/index.html /'
